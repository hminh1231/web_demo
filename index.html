<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Links Beauty & Health Center – Luxury Wellness</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['Playfair Display','serif'],
            sans: ['Inter','sans-serif']
          },
          colors: { gold: '#C6A75E' }
        }
      }
    };

    let currentLang = localStorage.getItem('olyLang') || 'en';

    const translations = {
      heroTitle: { en: 'Elevate Your Life', vi: 'Nâng tầm cuộc sống', ko: '삶의 수준을 높이세요' },
      heroDesc: { en: 'Inner Health. True Beauty.', vi: 'Sức khỏe nội tại. Vẻ đẹp đích thực.', ko: '내면의 건강. 진정한 아름다움.' },
      productTitle: { en: 'Our Collection', vi: 'Bộ sưu tập của chúng tôi', ko: '컬렉션 소개' },
      uploadBtn: { en: 'Upload Product', vi: 'Tải sản phẩm lên', ko: '제품 업로드' },
      backBtn: { en: 'Back to Products', vi: 'Quay lại sản phẩm', ko: '제품으로 돌아가기' }
    };

    function applyLanguage() {
      document.getElementById('heroTitle').innerText = translations.heroTitle[currentLang];
      document.getElementById('heroDesc').innerText = translations.heroDesc[currentLang];
      document.getElementById('productTitle').innerText = translations.productTitle[currentLang];

      // Buttons trong admin section
      const uploadBtn = document.getElementById('uploadBtn');
      const backBtn = document.getElementById('backBtn');
      if(uploadBtn) uploadBtn.innerText = translations.uploadBtn[currentLang];
      if(backBtn) backBtn.innerText = translations.backBtn[currentLang];
    }

    function addProduct() {
      alert('Product uploaded! (Demo only)');
    }

    function showAdminSection() {
      localStorage.setItem('olyAdmin','true');
      const adminSection = document.getElementById('adminSection');
      const productSection = document.getElementById('productSection');
      if(adminSection && productSection){
        adminSection.style.display = 'block';
        productSection.style.display = 'none';
      }
    }

    function showProducts() {
      const adminSection = document.getElementById('adminSection');
      const productSection = document.getElementById('productSection');
      if(adminSection && productSection){
        adminSection.style.display = 'none';
        productSection.style.display = 'block';
      }
    }

    window.onload = () => {
      applyLanguage();
      renderHeader();

      // Nếu có #admin trong URL, mở admin section
      if(window.location.hash === '#admin') showAdminSection();
    }
  </script>
</head>

<body class="bg-neutral-50 font-sans text-gray-800">

  <!-- HEADER -->
  <div id="site-header"></div>
  <script src="components/header.js"></script>

  <!-- HERO -->
  <section class="bg-black text-white" id="home">
    <div class="max-w-7xl mx-auto px-6 py-28 text-center">
      <h2 class="font-serif text-5xl mb-6" id="heroTitle"></h2>
      <p class="text-gray-300 max-w-2xl mx-auto" id="heroDesc"></p>
    </div>
  </section>

  <!-- PRODUCTS -->
  <section class="max-w-7xl mx-auto px-6 py-20" id="productSection">
    <h3 class="font-serif text-4xl mb-12 text-center" id="productTitle"></h3>
    <div id="productGrid" class="grid md:grid-cols-3 gap-10"></div>
  </section>

  <!-- ADMIN SECTION -->
  <section id="adminSection" class="bg-neutral-100 py-20" style="display:none;">
    <div class="max-w-xl mx-auto bg-white rounded-3xl shadow-lg p-10">
      <input id="pName" placeholder="Product name" class="w-full border rounded px-4 py-2 mb-4" />
      <textarea id="pDesc" placeholder="Product description" class="w-full border rounded px-4 py-2 mb-4"></textarea>
      <input id="pImg" placeholder="Image URL" class="w-full border rounded px-4 py-2 mb-6" />
      <button id="uploadBtn" onclick="addProduct()" class="w-full bg-black text-white py-3 rounded-full hover:opacity-90"></button>
      <button id="backBtn" onclick="showProducts()" class="mt-4 w-full bg-gray-800 text-white py-3 rounded-full hover:opacity-90"></button>
    </div>
  </section>

  <footer class="bg-black text-gray-400 text-center py-8">
    © 2026 Links Beauty & Health Center. Crafted with prestige.
  </footer>

</body>
</html>
